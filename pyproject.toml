[project]
name = "jev-jarvis"
version = "0.6.2"
description = "聊天消息意图识别悬浮窗：本地判断意图与风险，生成回复候选（macOS）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.32.0",
    "numpy>=2.0",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-vision>=12.2.2",
]
# Intel adaptation (jev-jarvis-mac-replica):
#   torch>=2.14 / transformers / laya serve ONLY the local decider-2b model, which
#   the upstream app restricts to Apple Silicon because torch has no macOS x86_64
#   wheel. On this Intel Mac the judgment layer runs through jev_compat.py (built-in
#   chat credentials, same Jev questions/answers), so those three heavy dependencies
#   are intentionally omitted. They are imported lazily inside judge.py and are never
#   reached on this path. huggingface-hub is KEPT: it is pure Python (no torch) and
#   supplies the tqdm progress bar exercised by the test suite.
